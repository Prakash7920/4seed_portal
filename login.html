<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>4Seed | Login</title>

<link rel="stylesheet" href="css/login.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

<div class="background">
    <div class="blob blob1"></div>
    <div class="blob blob2"></div>
</div>

<div class="login-card">

    <div class="logo">
        🌱
        <h2>4Seed</h2>
    </div>

    <h1>Welcome Back</h1>
    <p>Login to your Partner Account</p>

    <form id="loginForm">

        <div class="input-box">
            <span>👤</span>
            <input
                type="text"
                id="partnerId"
                placeholder="Partner ID"
                required>
        </div>

        <div class="input-box">
            <span>🔒</span>
            <input
                type="password"
                id="password"
                placeholder="Password"
                required>

            <button
                type="button"
                id="togglePassword">
                👁
            </button>
        </div>

        <div class="options">
            <label>
                <input type="checkbox">
                Remember Me
            </label>

            <a href="#">
                Forgot Password?
            </a>
        </div>

        <button class="login-btn" type="submit">
            Login Securely
        </button>

    </form>

    <div class="divider">
        <span>OR</span>
    </div>

    <a href="register.html" class="register-btn">
        Create New Account
    </a>

</div>

<script src="js/login.js"></script>

</body>
</html>
