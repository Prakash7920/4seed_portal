<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Genealogy | 4Seed Admin</title>

<link rel="stylesheet" href="css/admin.css">

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

<div class="admin-layout">

<!-- Sidebar -->

<aside class="sidebar">

<div class="logo">

<div class="logo-icon">🌱</div>

<div class="logo-text">

<h2>4Seed</h2>

<span>Admin Panel</span>

</div>

</div>

<ul class="menu">

<li onclick="location.href='admin.html'">
<i class="fas fa-home"></i>
<span>Dashboard</span>
</li>

<li onclick="location.href='partners.html'">
<i class="fas fa-users"></i>
<span>Partners</span>
</li>

<li onclick="location.href='wallet.html'">
<i class="fas fa-wallet"></i>
<span>Wallet</span>
</li>

<li onclick="location.href='withdraw.html'">
<i class="fas fa-money-check-dollar"></i>
<span>Withdraw</span>
</li>

<li class="active">
<i class="fas fa-sitemap"></i>
<span>Genealogy</span>
</li>

<li onclick="location.href='reports.html'">
<i class="fas fa-chart-line"></i>
<span>Reports</span>
</li>

<li onclick="logout()">
<i class="fas fa-right-from-bracket"></i>
<span>Logout</span>
</li>

</ul>

</aside>

<main class="main-content">

<header class="topbar">

<div>

<h1>Genealogy Tree</h1>

<p>View sponsor and downline structure</p>

</div>

<div class="top-actions">

<div class="search-box">

<i class="fas fa-search"></i>

<input
type="text"
id="partnerSearch"
placeholder="Partner ID"
onkeyup="searchTree()">

</div>

<button
class="primary-btn"
onclick="loadTree()">

<i class="fas fa-rotate"></i>

Refresh

</button>

</div>

</header>

<section class="card">

<div class="card-header">

<h2>Network Tree</h2>

</div>

<div
id="genealogyTree"
class="team-tree">

Loading...

</div>

</section>

<!-- ================================= -->
<!-- Partner Details Popup -->
<!-- ================================= -->

<div id="partnerPopup" class="popup">

    <div class="popup-content" style="max-width:700px;">

        <div class="popup-header">

            <h2>Partner Details</h2>

            <button
                class="close-btn"
                onclick="closePartnerPopup()">

                <i class="fas fa-times"></i>

            </button>

        </div>

        <div class="profile-card">

            <div class="profile-avatar">

                <i class="fas fa-user"></i>

            </div>

            <h3 id="treeName"></h3>

            <p id="treePartnerId"></p>

        </div>

        <div class="details-grid">

            <div>

                <label>Sponsor ID</label>

                <span id="treeSponsorId"></span>

            </div>

            <div>

                <label>Rank</label>

                <span id="treeRank"></span>

            </div>

            <div>

                <label>Wallet</label>

                ₹<span id="treeWallet"></span>

            </div>

            <div>

                <label>Status</label>

                <span id="treeStatus"></span>

            </div>

            <div>

                <label>Mobile</label>

                <span id="treeMobile"></span>

            </div>

            <div>

                <label>Email</label>

                <span id="treeEmail"></span>

            </div>

            <div>

                <label>Total Direct</label>

                <span id="treeDirect"></span>

            </div>

            <div>

                <label>Total Team</label>

                <span id="treeTeam"></span>

            </div>

        </div>

    </div>

</div>

<!-- ================================= -->
<!-- Floating Button -->
<!-- ================================= -->

<button
class="fab"
onclick="window.scrollTo({
top:0,
behavior:'smooth'
})">

<i class="fas fa-arrow-up"></i>

</button>

</main>

</div>

<script src="js/genealogy.js"></script>

</body>

</html>
